<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/images/logo/logo.png" />
    <title>Hospital CMS - Select Role</title>
    <!-- Google Fonts for Alegreya and Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>
    <script src="./js/components/header.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>
            <main class="main-content">
                <h2>Select Your <span>Role</span></h2>
                <div class="role-buttons">
                    <button id="adminLogin" class="btn dashboard-btn">Admin</button>
                    <button id="patientLogin" class="btn dashboard-btn">Patient</button>
                    <button id="doctorLogin" class="btn dashboard-btn">Doctor</button>
                </div>
            </main>
            <div id="footer"></div>
        </div>
    </div>

    <!-- Modal para login -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Official ES module script -->
    <script type="module" src="./js/services/index.js" defer></script>

    <!-- Interactive script supporting local file:/// preview without CORS restrictions -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            function showModal(content) {
                const modal = document.getElementById('modal');
                const modalBody = document.getElementById('modal-body');
                if (modal && modalBody) {
                    modalBody.innerHTML = content;
                    modal.style.display = 'block';
                }
            }

            function closeModal() {
                const modal = document.getElementById('modal');
                if (modal) modal.style.display = 'none';
            }

            const closeBtn = document.getElementById('closeModal');
            if (closeBtn) closeBtn.onclick = closeModal;

            window.onclick = function (event) {
                const modal = document.getElementById('modal');
                if (event.target === modal) closeModal();
            };

            const adminBtn = document.getElementById('adminLogin');
            if (adminBtn) {
                adminBtn.addEventListener('click', function () {
                    showModal(`
                        <h2>Admin Login</h2>
                        <input type="text" id="username" placeholder="Username" class="input-field" value="admin" />
                        <input type="password" id="password" placeholder="Password" class="input-field" value="admin123" />
                        <button class="dashboard-btn" id="adminSubmitBtn" style="width: 100%;">Login</button>
                    `);
                    document.getElementById('adminSubmitBtn').onclick = function () {
                        localStorage.setItem("userRole", "admin");
                        localStorage.setItem("token", "dummy-admin-token");
                        alert("¡Inicio de sesión exitoso como Administrador!");
                        window.location.href = "./pages/patientDashboard.html";
                    };
                });
            }

            const patientBtn = document.getElementById('patientLogin');
            if (patientBtn) {
                patientBtn.addEventListener('click', function () {
                    localStorage.setItem("userRole", "patient");
                    window.location.href = "./pages/patientDashboard.html";
                });
            }

            const doctorBtn = document.getElementById('doctorLogin');
            if (doctorBtn) {
                doctorBtn.addEventListener('click', function () {
                    showModal(`
                        <h2>Doctor Login</h2>
                        <input type="text" id="email" placeholder="Email" class="input-field" value="dr.adams@example.com" />
                        <input type="password" id="password" placeholder="Password" class="input-field" value="doctor123" />
                        <button class="dashboard-btn" id="doctorSubmitBtn" style="width: 100%;">Login</button>
                    `);
                    document.getElementById('doctorSubmitBtn').onclick = function () {
                        localStorage.setItem("userRole", "doctor");
                        localStorage.setItem("token", "dummy-doctor-token");
                        alert("¡Inicio de sesión exitoso como Doctor!");
                        window.location.href = "./pages/patientDashboard.html";
                    };
                });
            }
        });
    </script>
</body>

</html>
