<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" href="../../static/assets/images/logo/logo.png" />
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}" href="../../static/assets/css/adminDashboard.css">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}" href="../../static/assets/css/doctorDashboard.css">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}" href="../../static/assets/css/style.css">
    <script th:src="@{/js/render.js}" src="../../static/js/render.js" defer></script>
    <script th:src="@{/js/util.js}" src="../../static/js/util.js" defer></script>
    <script th:src="@{/js/components/header.js}" src="../../static/js/components/header.js" defer></script>
    <script th:src="@{/js/components/footer.js}" src="../../static/js/components/footer.js" defer></script>
</head>

<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>
            <main class="main-content">
                <input type="text" id="searchBar" class="searchBar" placeholder="Search Bar for custom output" />
                <div class="filter-wrapper" style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
                    <button id="todayButton" class="btn" style="background-color: #015c5d; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">Today's Appointments</button>
                    <input type="date" id="datePicker" class="filter-select" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc;" />
                </div>
                <table id="patientTable" class="table" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                    <thead>
                        <tr style="background-color: rgba(1, 92, 93, 0.85); color: white;">
                            <th style="padding: 12px; text-align: left;">Patient ID</th>
                            <th style="padding: 12px; text-align: left;">Name</th>
                            <th style="padding: 12px; text-align: left;">Phone No.</th>
                            <th style="padding: 12px; text-align: left;">Email</th>
                            <th style="padding: 12px; text-align: left;">Prescription</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody">
                        <!-- Citas inyectadas dinámicamente -->
                    </tbody>
                </table>
            </main>
            <div id="footer"></div>
        </div>
    </div>

    <!-- Modal para prescripciones -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module" th:src="@{/js/doctorDashboard.js}" src="../../static/js/doctorDashboard.js" defer></script>
</body>

</html>
