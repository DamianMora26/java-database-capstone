name: Lint Frontend

on:
  push:
  pull_request:

jobs:
  lint-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Linters
        run: npm install -g htmlhint stylelint stylelint-config-standard eslint

      - name: Lint HTML
        run: htmlhint "app/src/main/resources/static/**/*.html" || true

      - name: Lint CSS
        run: stylelint "app/src/main/resources/static/**/*.css" || true

      - name: Lint JavaScript
        run: eslint "app/src/main/resources/static/**/*.js" || true
