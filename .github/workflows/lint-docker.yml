name: Lint Dockerfile

on:
  push:
  pull_request:

jobs:
  hadolint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          ignore: DL3008,DL3015
